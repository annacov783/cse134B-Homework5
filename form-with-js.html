<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Website</title>
        <meta name="color-scheme" content="light dark">
        <script>
            try {
                const theme = localStorage.getItem('theme');
                if(theme === 'light' || theme === 'dark') {
                    document.documentElement.dataset.theme = theme;
                }
            } catch {}
        </script>
        <link rel="stylesheet" href="/styles.css">

        <link rel="icon" type="image/jpeg" href="/images/favicon.jpeg">

        <script src="form.js" defer></script>
        

        
        
    </head>
    <body>
        <header>    
            <hello-world></hello-world>
            <a href="/">
                <picture>
                    <source media="(min-width: 60rem)" srcset="/images/favicon.jpeg">
                    <img src="/images/logo_src2.png" alt="web logo2" width="50">
                </picture>
            </a>
            <span>
                <b>Portfolio</b>
                <br>
                <small>
                    <em>Bachelor's of Computer Science</em>
                </small>                
            </span>
               
            
            <nav class="horizontalMenu">
                <a href="/form-with-js">Form (With JS)</a>
                <ul class="main-menu">
                    <li><a href="/">Homepage</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/resume">Resume</a></li>
                    <li><a href="/interview_response_library">Interview Response Library</a></li>
                    <li><a href="/form-no-js">Form (No JS)</a></li>
                    <li><a href="/form-with-js">Form (With JS)</a></li>
                </ul>
                <label>
                    <input type="checkbox" id="theme-toggle">
                    <small>Dark Theme (Click To View Transition)</small>
                </label>

            </nav>
            
        </header>
        <main>
            <section>
                <h1>Form (With Javascript)</h1>
                <form id="withJSForm" class="noJSForm" action="https://httpbin.org/post" method="post">
                    <form-field>
                        
                        <label for="name">Name (required)</label><br>
                        <input id="name" name="name" type="text" minlength="2" maxlength="15" required autocomplete="name">
                        <span data-error-for="name" class="error"></span>
                        
                        <br><label for="email">Email (required)</label><br>
                        <input id="email" name="email" type="email" minlength="10" maxlength="20" required autocomplete="email">
                        <span data-error-for="email" class="error"></span>
                        
                        <br><label for="comments">Comments (required)</label><br>
                        <textarea id="comments" name="comments" minlength="5" maxlength="150" required></textarea>
                        <span data-error-for="comments" class="error"></span><br>
                        
                        <input name="possible_bot" type="hidden" value="true">
                        <input type="hidden" name="form-errors" id="form-errors">
                    </form-field>
                    <button type="submit">Submit</button>
                </form>
                
                
            </section>
        </main>
        <footer data-layout="cluster">
            <strong>Portfolio</strong>
            <i>Content crafted by creator.</i>
        </footer>

        <script src="/theme.js"></script>

    </body>
</html>
